<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HearLink Focus - Low Latency</title>
    <style>
        :root { --bg: #050505; --card: #111111; --accent: #00ffaa; --text: #ffffff; --border: #222; }
        body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; height: 100vh; justify-content: center;}
        .container { width: 100%; max-width: 360px; background: var(--card); padding: 30px; border-radius: 32px; border: 1px solid var(--border); box-shadow: 0 40px 80px rgba(0,0,0,0.8); text-align: center; }
        
        #visualizer { width: 100%; height: 60px; background: #000; border-radius: 12px; margin-bottom: 25px; border: 1px solid #1a1a1a; }
        
        button { width: 100%; padding: 20px; font-size: 1.2rem; font-weight: 900; border: none; border-radius: 18px; cursor: pointer; transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); text-transform: uppercase; letter-spacing: 1.5px;}
        .btn-start { background: var(--accent); color: #000; box-shadow: 0 0 20px rgba(0, 255, 170, 0.2); }
        .btn-stop { background: #ff3b3b; color: #fff; }
        
        .controls { background: #181818; padding: 20px; border-radius: 20px; border: 1px solid var(--border); margin-top: 25px; display: flex; flex-direction: column; gap: 15px; }
        .row { display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; font-weight: 800; color: #777; margin-bottom: 5px; }
        .badge { color: var(--accent); font-family: 'Courier New', monospace; font-size: 1rem; }
        
        input[type=range] { width: 100%; height: 6px; border-radius: 3px; background: #333; accent-color: var(--accent); cursor: pointer; appearance: none; }
        
        .status-tag { font-size: 0.6rem; color: #444; text-align: center; margin-top: 20px; text-transform: uppercase; font-weight: 900; letter-spacing: 3px; line-height: 1.6;}
    </style>
</head>
<body>

<div class="container">
    <div style="font-size: 0.7rem; color: var(--accent); font-weight: 900; letter-spacing: 2px; margin-bottom: 10px;">PRE-PROCESSOR ACTIVE</div>
    <h2 style="margin:0 0 20px 0; font-weight: 900; font-size: 1.8rem;">HearLink <span style="color:var(--accent)">FOCUS</span></h2>
    
    <canvas id="visualizer"></canvas>
    
    <button id="toggleBtn" class="btn-start" onclick="startLowLatencyFocus()">ENABLE LINK</button>
    
    <div class="controls">
        <div>
            <div class="row"><span>Transmission Gain</span><span class="badge" id="gainVal">80%</span></div>
            <input type="range" id="masterGain" min="0.0" max="1.5" step="0.05" value="0.80">
        </div>
        <div style="font-size: 0.75rem; color: #555; text-align: left; line-height: 1.5; border-top: 1px solid #222; padding-top: 12px;">
            <b>Bypass Mode Configured:</b><br>
            • Buffer: Ultra-Minimal (Interactive)<br>
            • HPF: 420Hz Ambient Kill<br>
            • Logic: Raw Signal Pass-through
        </div>
    </div>
    
    <div class="status-tag">Optimized for Programmed Hearing Aids<br>Latency: Interactive Direct</div>
</div>

<script>
    let audioCtx, stream, source, highPass, masterGainNode, analyser;
    let isRunning = false;

    async function startLowLatencyFocus() {
        if (isRunning) { location.reload(); return; }

        try {
            // 1. Force Exclusive Internal Mic & Disable all OS-level latent processing
            stream = await navigator.mediaDevices.getUserMedia({ 
                audio: { 
                    echoCancellation: false, 
                    noiseSuppression: false, 
                    autoGainControl: false,
                    latency: 0 // Request lowest possible hardware latency
                } 
            });

            // 2. High-Performance Audio Context
            audioCtx = new (window.AudioContext || window.webkitAudioContext)({ 
                latencyHint: 'interactive', // Critical for Bluetooth
                sampleRate: 48000 
            });

            source = audioCtx.createMediaStreamSource(stream);

            // 3. High-Pass Filter (The "Noise Floor" Cleaner)
            highPass = audioCtx.createBiquadFilter();
            highPass.type = "highpass";
            highPass.frequency.value = 420; 

            // 4. Output Gain (Sent to Bluetooth)
            masterGainNode = audioCtx.createGain();
            
            // 5. Minimal Visualizer Analyser (Tiny FFT to save CPU cycles)
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 32; 

            // Connect Chain: Mic -> Clean Filter -> Gain -> Bluetooth Destination
            source.connect(highPass);
            highPass.connect(masterGainNode);
            masterGainNode.connect(audioCtx.destination);
            masterGainNode.connect(analyser);

            isRunning = true;
            const btn = document.getElementById('toggleBtn');
            btn.textContent = "DISCONNECT";
            btn.className = "btn-stop";
            
            updateSettings();
            drawVisual();

            document.getElementById('masterGain').oninput = updateSettings;

        } catch (err) {
            alert("Connection Error: " + err.message);
        }
    }

    function updateSettings() {
        if (!isRunning) return;
        const g = parseFloat(document.getElementById('masterGain').value);
        // Using setTargetAtTime to avoid clicks while remaining fast
        masterGainNode.gain.setTargetAtTime(g, audioCtx.currentTime, 0.005);
        document.getElementById('gainVal').textContent = Math.round(g * 100) + "%";
    }

    function drawVisual() {
        if (!isRunning) return;
        requestAnimationFrame(drawVisual);
        const data = new Uint8Array(analyser.frequencyBinCount);
        analyser.getByteFrequencyData(data);
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');
        
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        const barWidth = (canvas.width / data.length) * 2;
        for(let i = 0; i < data.length; i++) {
            const h = (data[i] / 255) * canvas.height;
            ctx.fillStyle = '#00ffaa';
            ctx.fillRect(i * (barWidth + 2), canvas.height - h, barWidth, h);
        }
    }
</script>
</body>
</html>
